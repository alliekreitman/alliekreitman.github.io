###############################################################
# Site settings for alliekreitman.github.io / allieskreitman.com
# Built with Jekyll + the Beautiful Jekyll theme (MIT).
###############################################################

# --- Site identity --- #

title: Allie Kreitman        # shown in the navbar
author: Allie Kreitman       # shown in the footer
url: "https://allieskreitman.com"
url-pretty: "allieskreitman.com"   # how the site is linked in the footer

# --- Navigation bar --- #
# Each entry is "Label: /permalink/" and must match the `permalink`
# in the matching page's front matter.

navbar-links:
  Home: "/"
  Publications: "/Publications/"
  Research: "/Research/"

# Small round image in the top-left of the navbar
avatar: "/assets/img/avatar.png"
round-avatar: true

# --- Footer social links --- #
# Only these four are rendered; see _includes/social-networks-links.html
# for the full list of networks the theme supports.

social-network-links:
  email: "allie.kreitman@gmail.com"
  github: alliekreitman
  linkedin: alliekreitman
  ORCID: 0000-0002-0390-5425

# --- Colours --- #

navbar-col: "#ededed"
navbar-text-col: "#404040"
navbar-border-col: "#FFFFFF"
page-col: "#FFFFFF"
text-col: "#404040"
link-col: "#597e94"
hover-col: "#316e91"
footer-col: "#ededed"
footer-text-col: "#777777"
footer-link-col: "#404040"
footer-hover-col: "#316e91"

# --- Build settings --- #

timezone: "America/Los_Angeles"
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM

# Every page uses the "page" layout unless it says otherwise
defaults:
  - scope:
      path: ""
    values:
      layout: "page"

plugins:
  - jekyll-sitemap

exclude:
  - CNAME
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
